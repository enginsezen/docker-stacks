services:
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_VERSION}
    restart: unless-stopped

    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED}
      WEBSOCKET_ENABLED: ${WEBSOCKET_ENABLED}

    volumes:
      - ./data:/data
