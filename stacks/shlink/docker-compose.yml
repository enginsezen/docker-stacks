services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data

  shlink:
    image: shlinkio/shlink:${SHLINK_VERSION}
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN}
      IS_HTTPS_ENABLED: ${IS_HTTPS_ENABLED}
      INITIAL_API_KEY: ${SHLINK_API_KEY}
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TIMEZONE: ${TIMEZONE}

  web-client:
    image: shlinkio/shlink-web-client:${SHLINK_WEB_CLIENT_VERSION}
    restart: unless-stopped
    depends_on:
      - shlink
    environment:
      SHLINK_SERVER_NAME: ${SHLINK_SERVER_NAME}
      SHLINK_SERVER_URL: ${SHLINK_SERVER_URL}
      SHLINK_SERVER_API_KEY: ${SHLINK_API_KEY}
